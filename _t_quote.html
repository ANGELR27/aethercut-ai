<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  .quote-card {
    width: 660px;
    background: linear-gradient(145deg, rgba(9, 10, 13, 0.98) 0%, rgba(4, 5, 7, 0.99) 100%);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-left: 4px solid #38bdf8;
    box-shadow: 0 32px 80px rgba(0, 0, 0, 0.95), 0 0 40px rgba(12, 24, 48, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    padding: 30px 34px;
    color: #f8fafc;
    position: relative;
  }
  .quote-mark {
    position: absolute;
    top: 16px; right: 24px;
    font-family: 'Outfit', sans-serif;
    font-size: 80px;
    line-height: 1;
    color: rgba(56, 189, 248, 0.12);
    user-select: none;
  }
  .q-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 4px;
    background: rgba(56, 189, 248, 0.15);
    border: 1px solid rgba(56, 189, 248, 0.35);
    color: #38bdf8;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 16px;
  }
  .q-text {
    font-family: 'Outfit', sans-serif;
    font-size: 26px;
    font-weight: 700;
    line-height: 1.35;
    color: #ffffff;
    margin-bottom: 20px;
    letter-spacing: -0.3px;
  }
  .hl {
    color: #38bdf8;
    text-shadow: 0 0 16px rgba(56, 189, 248, 0.6);
  }
  .q-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    padding-top: 14px;
    font-size: 12px;
    color: #94a3b8;
    font-family: 'JetBrains Mono', monospace;
  }
  .q-author {
    color: #e2e8f0;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="quote-card">
    <div class="quote-mark">“</div>
    <div class="q-badge">● ÉNFASIS CLAVE</div>
    <div class="q-text">«La verdad siempre prevalece.»</div>
    <div class="q-footer">
      <span class="q-author">— Afirmación Destacada</span>
      <span>DECLARACIÓN VERIFICADA</span>
    </div>
  </div>
</body>
</html>
