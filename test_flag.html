<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  .flag-card {
    width: 580px;
    background: linear-gradient(135deg, rgba(17, 24, 39, 0.96) 0%, rgba(3, 7, 18, 0.98) 100%);
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 25px rgba(99, 102, 241, 0.12);
    border-radius: 12px;
    padding: 24px 28px;
    color: #f8fafc;
    position: relative;
    overflow: hidden;
  }
  .top-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    padding-bottom: 10px;
  }
  .role-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 4px;
    background: rgba(99, 102, 241, 0.15);
    border: 1px solid rgba(99, 102, 241, 0.35);
    color: #818cf8;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
  }
  .stat-pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: #38bdf8;
    background: rgba(56, 189, 248, 0.1);
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid rgba(56, 189, 248, 0.25);
  }
  .flag-body {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 14px;
  }
  .flag-icon {
    font-size: 54px;
    line-height: 1;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
  }
  .country-title {
    font-family: 'Outfit', sans-serif;
    font-size: 26px;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.15;
  }
  .detail-text {
    font-size: 13.5px;
    line-height: 1.5;
    color: #cbd5e1;
  }
</style>
</head>
<body>
  <div class="flag-card">
    <div class="top-meta">
      <div class="role-badge">● POTENCIA MILITAR</div>
      <div class="stat-pill"> PRESUPUESTO</div>
    </div>
    <div class="flag-body">
      <div class="flag-icon">🇺🇸</div>
      <div>
        <div class="country-title">ESTADOS UNIDOS</div>
      </div>
    </div>
    <div class="detail-text">Despliegue operativo de sistemas autónomos de combate y enjambres colaborativos.</div>
  </div>
</body>
</html>
