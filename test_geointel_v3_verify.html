<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .map-card {
    width: 960px;
    height: 540px;
    position: relative;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.10);
    box-shadow: 0 40px 100px rgba(0,0,0,0.98);
    background: #04080f;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  .sat-photo {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    filter: brightness(0.78) contrast(1.25) saturate(1.0) hue-rotate(-5deg);
  }
  /* Subtle geospatial coordinate grid */
  .grid-overlay {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 64px 64px;
    pointer-events: none;
    z-index: 3;
  }
  /* Left-side dark panel overlay */
  .side-panel {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 330px;
    background: linear-gradient(to right, rgba(4,8,15,0.97) 70%, rgba(4,8,15,0.0) 100%);
    z-index: 5;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 0 28px 28px;
  }
  /* Top accent bar — left only */
  .accent-bar {
    position: absolute;
    top: 0; left: 0;
    width: 330px; height: 3px;
    background: linear-gradient(to right, #38bdf8, transparent);
    z-index: 20;
  }
  /* Top-right status row */
  .status-row {
    position: absolute;
    top: 22px; right: 22px;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 10;
  }
  .status-chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    background: rgba(4,8,15,0.75);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 2px;
    padding: 5px 12px;
  }
  .status-chip.active {
    color: #38bdf8;
    border-color: rgba(56,189,248,0.3);
    background: rgba(56,189,248,0.06);
  }
  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #38bdf8;
    box-shadow: 0 0 8px #38bdf8;
    flex-shrink: 0;
  }
  /* Coordinate readout top-right */
  .coord-readout {
    position: absolute;
    top: 56px; right: 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: rgba(255,255,255,0.38);
    letter-spacing: 0.8px;
    z-index: 10;
    text-align: right;
    line-height: 1.6;
  }
  /* Cartographic scale bar bottom-right */
  .scale-bar {
    position: absolute;
    bottom: 22px;
    right: 22px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    z-index: 10;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    color: rgba(255,255,255,0.45);
    letter-spacing: 1.2px;
  }
  .scale-ticks {
    width: 60px;
    height: 4px;
    border-left: 1.5px solid rgba(56,189,248,0.5);
    border-right: 1.5px solid rgba(56,189,248,0.5);
    border-bottom: 1.5px solid rgba(56,189,248,0.5);
  }
  /* --- Side panel internals --- */
  .panel-region {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #38bdf8;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 10px;
  }
  .panel-region svg { flex-shrink: 0; }
  .region-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, rgba(56,189,248,0.4), transparent);
  }
  .panel-title {
    font-family: 'Outfit', sans-serif;
    font-size: 22px;
    font-weight: 800;
    color: #f0f4f8;
    line-height: 1.15;
    letter-spacing: -0.5px;
    margin-bottom: 12px;
  }
  .panel-divider {
    width: 100%;
    height: 1px;
    background: rgba(255,255,255,0.08);
    margin-bottom: 12px;
  }
  .panel-desc {
    font-size: 12.5px;
    color: rgba(203,213,225,0.75);
    line-height: 1.55;
    margin-bottom: 16px;
  }
  .telemetry-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: 'JetBrains Mono', monospace;
  }
  .tele-label {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 1.4px;
    color: rgba(255,255,255,0.30);
    text-transform: uppercase;
  }
  .tele-value {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: rgba(255,255,255,0.72);
  }
  /* --- Reticle target marker --- */
  .target-wrap {
    position: absolute;
    left: 330px;
    top: 265px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 8;
  }
  .ring-outer {
    position: absolute;
    left: -36px; top: -36px;
    width: 72px; height: 72px;
    border-radius: 50%;
    border: 1px dashed rgba(56,189,248,0.45);
  }
  .ring-inner {
    position: absolute;
    left: -18px; top: -18px;
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1.5px solid rgba(56,189,248,0.85);
  }
  .dot-core {
    position: absolute;
    left: -3px; top: -3px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #38bdf8;
    box-shadow: 0 0 12px #38bdf8;
  }
  .hair-h {
    position: absolute;
    left: -28px; top: 0;
    width: 56px; height: 1px;
    background: linear-gradient(90deg, transparent 0%, rgba(56,189,248,0.7) 40%, rgba(56,189,248,0.7) 60%, transparent 100%);
  }
  .hair-v {
    position: absolute;
    left: 0; top: -28px;
    width: 1px; height: 56px;
    background: linear-gradient(180deg, transparent 0%, rgba(56,189,248,0.7) 40%, rgba(56,189,248,0.7) 60%, transparent 100%);
  }
  /* Corner brackets on the card */
  .corner {
    position: absolute;
    width: 18px; height: 18px;
    border-color: rgba(56,189,248,0.45);
    border-style: solid;
    z-index: 12;
  }
  .corner-tl { top: 14px; left: 14px; border-width: 1.5px 0 0 1.5px; }
  .corner-tr { top: 14px; right: 14px; border-width: 1.5px 1.5px 0 0; }
  .corner-bl { bottom: 14px; left: 14px; border-width: 0 0 1.5px 1.5px; }
  .corner-br { bottom: 14px; right: 14px; border-width: 0 1.5px 1.5px 0; }
  /* Connector line from target to panel */
  .connector-svg {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 7;
  }
</style>
</head>
