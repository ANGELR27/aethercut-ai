<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: transparent; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
  .card { width: 800px; padding: 30px; border-radius: 20px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 20px 50px rgba(0,0,0,0.8); color: white; }
  h1 { margin: 0 0 10px 0; color: #38bdf8; }
</style>
</head>
<body>
  <div class="card">
    <h1>Test Modern Card</h1>
    <p>Rendered via Headless Chrome</p>
  </div>
</body>
</html>
