<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  .lt-container {
    width: 780px;
    background: linear-gradient(90deg, rgba(15, 23, 42, 0.96) 0%, rgba(15, 23, 42, 0.85) 75%, transparent 100%);
    border-left: 4px solid #38bdf8;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    border-radius: 0 10px 10px 0;
    padding: 16px 26px;
    color: #ffffff;
    position: relative;
  }
  .lt-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    color: #38bdf8;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .lt-title {
    font-family: 'Outfit', sans-serif;
    font-size: 24px;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.2;
    margin-bottom: 4px;
  }
  .lt-sub {
    font-size: 13.5px;
    color: #cbd5e1;
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="lt-container">
    <div class="lt-tag">● INFORME ESTRATÉGICO</div>
    <div class="lt-title">Sistemas Autónomos de Defensa</div>
    <div class="lt-sub">Análisis estratégico sobre la doctrina de combate 2026</div>
  </div>
</body>
</html>
