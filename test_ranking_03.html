<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  .ranking-card {
    width: 640px;
    background: linear-gradient(135deg, rgba(15, 23, 42, 0.96) 0%, rgba(2, 6, 23, 0.98) 100%);
    border: 1px solid rgba(255, 255, 255, 0.16);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.85), 0 0 50px rgba(56, 189, 248, 0.2);
    border-radius: 16px;
    padding: 32px 36px;
    color: #ffffff;
    display: flex;
    align-items: center;
    gap: 32px;
    position: relative;
    overflow: hidden;
  }
  .ranking-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #38bdf8, #818cf8, #fbbf24);
  }
  .number-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 130px;
    height: 130px;
    background: rgba(2, 6, 23, 0.7);
    border: 1px solid rgba(56, 189, 248, 0.35);
    box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
    border-radius: 14px;
    position: relative;
  }
  .big-number {
    font-family: 'Outfit', sans-serif;
    font-size: 82px;
    font-weight: 800;
    line-height: 1;
    background: linear-gradient(180deg, #ffffff 0%, #38bdf8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.6));
    letter-spacing: -2px;
  }
  .info-content {
    flex: 1;
  }
  .rank-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 4px;
    background: rgba(56, 189, 248, 0.15);
    border: 1px solid rgba(56, 189, 248, 0.4);
    color: #38bdf8;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  .rank-title {
    font-family: 'Outfit', sans-serif;
    font-size: 28px;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.2;
    margin-bottom: 8px;
  }
  .rank-sub {
    font-size: 14px;
    color: #cbd5e1;
    line-height: 1.45;
  }
</style>
</head>
<body>
  <div class="ranking-card">
    <div class="number-box">
      <div class="big-number">03</div>
    </div>
    <div class="info-content">
      <div class="rank-badge">● PUESTO 03 · RANKING</div>
      <div class="rank-title">Drones Autónomos de Combate</div>
      <div class="rank-sub">Tercera tecnología más disruptiva en la doctrina 2026</div>
    </div>
  </div>
</body>
</html>
