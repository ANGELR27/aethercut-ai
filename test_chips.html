<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  .chips-track {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
  }
  .glass-chip {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(15, 23, 42, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    border-radius: 999px;
    padding: 8px 18px;
    color: #f8fafc;
  }
  .flag-thumb {
    width: 22px;
    height: 15px;
    border-radius: 3px;
    object-fit: cover;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .chip-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #38bdf8;
    box-shadow: 0 0 8px #38bdf8;
  }
  .chip-text {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.2px;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="chips-track">
    
              <div class="glass-chip">
                <img src="https://flagcdn.com/w80/us.png" class="flag-thumb" alt="us">
                <span class="chip-text">Estados Unidos</span>
              </div>
            
              <div class="glass-chip">
                <img src="https://flagcdn.com/w80/cn.png" class="flag-thumb" alt="cn">
                <span class="chip-text">China</span>
              </div>
            
              <div class="glass-chip">
                <span class="chip-dot"></span>
                <span class="chip-text">Inteligencia Artificial</span>
              </div>
            
  </div>
</body>
</html>
