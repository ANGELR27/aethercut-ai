<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  .tracker-bar {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    background: linear-gradient(145deg, rgba(9, 10, 13, 0.96) 0%, rgba(4, 5, 7, 0.98) 100%);
    border: 1px solid rgba(255, 255, 255, 0.10);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    border-radius: 999px;
    padding: 9px 26px;
    color: #ffffff;
  }
  .ch-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }
  .ch-pill.active {
    color: #38bdf8;
    font-weight: 800;
    font-size: 15px;
    text-shadow: 0 0 14px rgba(56, 189, 248, 0.5);
  }
  .ch-pill.past {
    color: #cbd5e1;
    font-weight: 500;
  }
  .check-icon {
    display: inline-flex;
    align-items: center;
  }
  .ch-pill.future {
    color: #64748b;
    font-weight: 500;
  }
  .pulse-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #38bdf8;
    box-shadow: 0 0 10px #38bdf8;
  }
  .divider-line {
    width: 14px;
    height: 1px;
    background: rgba(255, 255, 255, 0.15);
  }
</style>
</head>
<body>
  <div class="tracker-bar">
    <div class="ch-pill past"><span class="check-icon"><svg width="12" height="10" viewBox="0 0 12 10" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 5L4.2 8.5L11 1.5" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>INTRODUCCION</span></div><div class="divider-line"></div><div class="ch-pill active"><span class="pulse-dot"></span><span>EVIDENCIA ORBITAL</span></div><div class="divider-line"></div><div class="ch-pill future"><span>ANALISIS FORENSE</span></div><div class="divider-line"></div><div class="ch-pill future"><span>CONCLUSION</span></div>
  </div>
</body>
</html>
