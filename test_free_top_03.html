<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  .free-wrap {
    text-align: center;
    max-width: 1400px;
    padding: 30px;
  }
  .free-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 4px;
    color: #38bdf8;
    text-shadow: 0 0 20px #38bdf8, 0 2px 10px rgba(0,0,0,0.9);
    text-transform: uppercase;
    margin-bottom: 8px;
    display: inline-block;
  }
  .free-num {
    font-family: 'Outfit', sans-serif;
    font-size: 136px;
    font-weight: 900;
    line-height: 0.92;
    background: linear-gradient(180deg, #ffffff 10%, #38bdf8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 15px 40px rgba(0,0,0,0.95)) drop-shadow(0 0 35px #38bdf866);
    letter-spacing: -4px;
    margin-bottom: 8px;
  }
  .free-title {
    font-family: 'Outfit', sans-serif;
    font-size: 70px;
    font-weight: 800;
    line-height: 1.08;
    color: #ffffff;
    text-shadow: 0 8px 45px rgba(0,0,0,0.95), 0 3px 12px rgba(0,0,0,0.85);
    letter-spacing: -1.2px;
    text-transform: uppercase;
  }
  .hl {
    color: #38bdf8;
    text-shadow: 0 0 35px #38bdf8, 0 4px 30px rgba(0,0,0,0.9);
  }
  .free-sub {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 24px;
    font-weight: 600;
    color: #cbd5e1;
    text-shadow: 0 4px 25px rgba(0,0,0,0.95);
    margin-top: 14px;
    letter-spacing: 0.4px;
  }
</style>
</head>
<body>
  <div class="free-wrap">
    <div class="free-tag">● PUESTO 03 · RANKING</div>
    <div class="free-num">03</div>
    <div class="free-title">DRONES <span class="hl">AUTÓNOMOS</span></div>
    <div class="free-sub">Sistemas balísticos sin piloto humano</div>
  </div>
</body>
</html>
