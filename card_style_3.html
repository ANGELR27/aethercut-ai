<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  .card {
    width: 440px;
    height: 440px;
    background: linear-gradient(160deg, rgba(17, 24, 39, 0.96) 0%, rgba(3, 7, 18, 0.98) 100%);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    padding: 30px;
    color: #f8fafc;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .card::after {
    content: '';
    position: absolute;
    bottom: -60px; right: -60px;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(16, 185, 129, 0.25) 0%, transparent 70%);
    pointer-events: none;
  }
  .sq-badge {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 6px;
    background: rgba(16, 185, 129, 0.12);
    border: 1px solid rgba(16, 185, 129, 0.35);
    color: #34d399;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
  }
  .sq-big-stat {
    font-family: 'Outfit', sans-serif;
    font-size: 60px;
    font-weight: 800;
    line-height: 1;
    color: #ffffff;
    letter-spacing: -1.5px;
    margin: 14px 0 4px;
  }
  .sq-stat-lbl {
    font-size: 13px;
    color: #34d399;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .sq-title {
    font-family: 'Outfit', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1.25;
    margin-bottom: 8px;
  }
  .sq-desc {
    font-size: 13px;
    color: #94a3b8;
    line-height: 1.45;
  }
  .sq-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    padding-top: 14px;
    font-size: 11px;
    color: #64748b;
  }
</style>
</head>
<body>
  <div class="card">
    <div>
      <div class="sq-badge">● Dato Verificado</div>
      <div class="sq-big-stat">95%</div>
      <div class="sq-stat-lbl">Precisión en Combate</div>
    </div>
    <div>
      <div class="sq-title">Drones Autónomos</div>
      <div class="sq-desc">Sistemas algorítmicos capaces de operar en enjambre sin asistencia de operadores remotos.</div>
    </div>
    <div class="sq-footer">
      <span>Registro Oficial 2026</span>
      <span>✓ Certificado</span>
    </div>
  </div>
</body>
</html>
